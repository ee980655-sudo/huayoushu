<script>(() => {
'use strict';
const factories = {"app.mjs": function(requireModule) {
const {createStore,STORAGE_KEY} = requireModule("core/store.mjs");
const {localDate,validMonth,shiftMonth,getBudget} = requireModule("core/model.mjs");
const {summarize} = requireModule("core/analytics.mjs");

const {renderPage:overview} = requireModule("pages/overview.mjs");

const pages=[['overview','消费总览','01'],['ledger','我的账单','02'],['insights','消费洞察','03'],['purchases','买前想想','04'],['budget','预算与目标','05'],['report','月度复盘','06'],['settings','设置与数据','07']];

try{storage=window.localStorage;}catch{storage={getItem(){throw new Error('浏览器禁止本地存储');},setItem(){throw new Error('浏览器禁止本地存储');}};}
const store=createStore(storage);
let month=localDate().slice(0,7),renderId=0,externalChanged=false;
const root=document.getElementById('app');
function currentRoute(){const hash=location.hash.slice(1);const [path,query='']=hash.split('?');return {page:pages.some(item=>item[0]===path)?path:'overview',params:new URLSearchParams(query)};}
function navigate(page,params={}){const query=new URLSearchParams(params).toString();const next=`#${page}${query?'?'+query:''}`;if(location.hash===next)render();else location.hash=next;window.scrollTo({top:0,behavior:'instant'});}

    el('div',{class:'nav-caption'},'我的生活账本'),
    el('nav',{'aria-label':'主导航'},pages.map(([key,label,number])=>el('a',{href:`#${key}`,class:`nav-item ${page===key?'active':''}`,'aria-current':page===key?'page':null},[el('span',{class:'nav-number','aria-hidden':'true'},number),label,key==='purchases'?el('span',{class:'nav-dot','aria-hidden':'true'}):null]))),
    el('div',{class:'sidebar-bottom'},[el('div',{class:'local-note'},[el('span',{class:'local-dot'}),'只属于你的本地账本',el('small',{},'AI 汇总，仅在你同意后发送。')]),
      el('div',{class:'profile'},[el('span',{class:'avatar'},state.mode==='demo'?'样':'我'),el('span',{},[el('strong',{},state.mode==='demo'?'演示账本':'我的账本'),el('small',{},'本机 · 免登录')]),button('↗',()=>navigate('settings'),'icon-button',{'aria-label':'打开设置'})])])
  ]);
  const monthInput=input('month',month,{min:'1900-01',max:'2200-12','aria-label':'选择月份',onChange:event=>setMonth(event.target.value)});
  const bar=el('header',{class:'topbar'},[
    el('div',{class:'breadcrumb'},[el('span',{},'我的账本'),el('span',{'aria-hidden':'true'},'/'),el('strong',{},name)]),
    el('div',{class:'topbar-actions'},[button(state.mode==='demo'?'演示数据 · 虚构':'个人数据 · 本地',switchBook,'mode-pill',{'aria-label':state.mode==='demo'?'切换到个人账本':'切换到演示账本'}),
      el('div',{class:'month-picker'},[button('‹',()=>setMonth(shiftMonth(month,-1)),'icon-button',{'aria-label':'上个月'}),monthInput,button('›',()=>setMonth(shiftMonth(month,1)),'icon-button',{'aria-label':'下个月'})])])
  ]);
  const main=el('main',{id:'main',tabindex:-1});

  const context={state,book,month,store,navigate,setMonth,notify,params};

  }catch(error){if(requestId!==renderId)return;main.append(el('div',{class:'error-panel'},[el('h1',{},'页面未能打开'),el('p',{},error.message),button('回到总览',()=>navigate('overview'),'primary')]));console.error(error);}
  if(store.error)main.prepend(el('div',{class:'recovery-banner',role:'alert'},[store.error,'。原始数据已保留，当前展示临时演示视图。',button('处理本地数据',()=>navigate('settings'),'text-button')]));
  if(externalChanged)main.prepend(el('div',{class:'recovery-banner',role:'alert'},['另一标签页更新了账本，请刷新后再编辑。',button('刷新',()=>location.reload(),'text-button')]));

store.subscribe(render);
window.addEventListener('hashchange',async()=>{await render();window.scrollTo({top:0,behavior:'instant'});});
document.querySelector('.skip-link').addEventListener('click',event=>{event.preventDefault();document.getElementById('main')?.focus();});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){externalChanged=true;render();}});
const originalCommit=store.commit;
store.commit=reducer=>externalChanged?{ok:false,error:'另一标签页已更新账本，请刷新以避免覆盖。'}:originalCommit(reducer);

"core/ai.mjs": function(requireModule) {
const {summarize} = requireModule("core/analytics.mjs");
const {localDate} = requireModule("core/model.mjs");

function buildAISummary(book,month,today=localDate()){
  const summary=summarize(book.transactions.filter(row=>row.date<=today),month);
  return {month,count:summary.count,incomeCents:summary.incomeCents,expenseCents:summary.expenseCents,refundCents:summary.refundCents,netExpenseCents:summary.netExpenseCents,budgetCents:book.budgets[month]?.totalCents??0,categories:summary.categories};
}

return {buildAISummary};
},
"core/analytics.mjs": function(requireModule) {
const {CATEGORIES,shiftMonth,localDate} = requireModule("core/model.mjs");

function summarize(transactions,month) {
  const rows = transactions.filter(row=>row.date.slice(0,7)===month);
  const categories = Object.fromEntries(CATEGORIES.map(category=>[category,0]));
  const daily = {};
  let incomeCents=0, expenseCents=0, refundCents=0;
  for (const row of rows) {
    if (row.type==='income') incomeCents+=row.amountCents;
    if (row.type==='expense') expenseCents+=row.amountCents;
    if (row.type==='refund') refundCents+=row.amountCents;
    const spending = row.type==='expense'?row.amountCents:row.type==='refund'?-row.amountCents:0;
    if (spending) {
      categories[row.category]=(categories[row.category]??0)+spending;
      daily[row.date]=(daily[row.date]??0)+spending;
    }
  }
  return {incomeCents,expenseCents,refundCents,netExpenseCents:expenseCents-refundCents,categories,daily,count:rows.length};
}
function compareMonths(transactions,month,today=new Date()) {
  const previous=shiftMonth(month,-1);
  const monthDays=value=>{const [year,number]=value.split('-').map(Number);return new Date(year,number,0).getDate();};
  const todayMonth=localDate(today).slice(0,7);
  const comparableDays=Math.min(monthDays(month),monthDays(previous),month===todayMonth?today.getDate():month>todayMonth?0:31);
  const filtered=transactions.filter(row=>Number(row.date.slice(-2))<=comparableDays);
  const currentCents=summarize(filtered,month).netExpenseCents;
  const previousCents=summarize(filtered,previous).netExpenseCents;
  return {currentCents,previousCents,percentage:previousCents>0?Math.round((currentCents-previousCents)/previousCents*1000)/10:null,comparableDays};
}
const RULES={growthPercent:30,repeatCount:4};
function buildInsights(book,month,today=new Date()) {
  const available=book.transactions.filter(row=>row.date<=localDate(today));
  const rows=available.filter(row=>row.date.startsWith(month)&&row.type==='expense');
  if(!rows.length)return [];
  const summary=summarize(available,month),budget=book.budgets[month];
  const insights=[];
  for(const category of CATEGORIES) {
    const amount=summary.categories[category],limit=budget?.categoryLimits[category]??0;
    const evidence=rows.filter(row=>row.category===category).map(row=>row.id);
    if(limit>0&&amount>limit)insights.push({id:`${month}:budget:${category}`,category,title:`${category}支出，超出计划一点了`,
      explanation:`截至已有记录，${category}净支出 ¥${(amount/100).toFixed(2)}，高于分类预算 ¥${(limit/100).toFixed(2)}。差额为 ¥${((amount-limit)/100).toFixed(2)}。`,
      suggestion:'可以先看看是哪几笔带来的变化，再决定调整消费还是重新分配预算。',evidenceTransactionIds:evidence,rule:'预算检查 · 净支出高于已设置额度'});
  }
  const comparison=compareMonths(available,month,today);
  if(comparison.percentage!==null&&comparison.percentage>=RULES.growthPercent)insights.push({id:`${month}:growth`,category:null,title:'和上月同期比，这个月花得多了一些',
    explanation:`比较两个自然月的 1–${comparison.comparableDays} 日，净支出增加 ${comparison.percentage}%。这也可能来自必要的大额购买或记录完整度变化。`,
    suggestion:'核对两个月的记录是否完整，再决定哪些支出值得调整。',evidenceTransactionIds:rows.filter(row=>Number(row.date.slice(-2))<=comparison.comparableDays).map(row=>row.id),rule:`同期比较 · 增幅达到 ${RULES.growthPercent}%（演示阈值）`});
  const top=Object.entries(summary.categories).sort((first,second)=>second[1]-first[1])[0];
  if(top?.[1]>0&&!insights.some(item=>item.category===top[0]))insights.push({id:`${month}:top:${top[0]}`,category:top[0],title:`${top[0]}，是本月最大的支出项`,
    explanation:`当前账本中，${top[0]}净支出为 ¥${(top[1]/100).toFixed(2)}。金额最多不代表不合理，先确认它是否符合你的实际需要。`,
    suggestion:'展开相关账单，看看哪些是必要开销，哪些是可以灵活安排的部分。',evidenceTransactionIds:rows.filter(row=>row.category===top[0]).map(row=>row.id),rule:'分类观察 · 依据净支出排序'});
  const merchants=new Map();
  for(const row of rows.filter(row=>['购物','娱乐'].includes(row.category)))merchants.set(row.merchant,[...(merchants.get(row.merchant)??[]),row]);
  const repeated=[...merchants].find(([,records])=>records.length>=RULES.repeatCount);
  if(repeated)insights.push({id:`${month}:frequency:${repeated[0]}`,category:repeated[1][0].category,title:'有一家店，这个月常常出现',
    explanation:`「${repeated[0]}」共有 ${repeated[1].length} 笔支出。这只是频次观察，不代表冲动消费。`,suggestion:'如果你想减少这个类别的支出，可以先试一个小目标，再观察是否适合自己。',
    evidenceTransactionIds:repeated[1].map(row=>row.id),rule:`频次观察 · 至少 ${RULES.repeatCount} 笔（演示阈值）`});
  return insights.slice(0,5);
}

return {summarize,compareMonths,RULES,buildInsights};
},
"core/csv.mjs": function(requireModule) {
const {parseMoney,validateTransaction,uid,TYPES,CATEGORIES} = requireModule("core/model.mjs");

const CSV_HEADERS=['日期','商户','类型','分类','金额','备注'];
function parseCSV(text) {
  const input=String(text).replace(/^\uFEFF/,'');
  const rows=[];let row=[],field='',quoted=false,closed=false;
  for(let index=0;index<input.length;index++) {
    const char=input[index];
    if(quoted) {
      if(char==='"') {if(input[index+1]==='"'){field+='"';index++;}else{quoted=false;closed=true;}}
      else field+=char;
    } else if(char===',') {row.push(field);field='';closed=false;}
    else if(char==='\n' || char==='\r') {
      if(char==='\r' && input[index+1]==='\n') index++;
      row.push(field);rows.push(row);row=[];field='';closed=false;
    } else if(char==='"') {
      if(field || closed) throw new Error('CSV 引号位置无效');quoted=true;
    } else {
      if(closed) throw new Error('CSV 引号结束后存在多余字符');field+=char;
    }
  }
  if(quoted) throw new Error('CSV 引号未闭合');
  if(field || row.length || closed) {row.push(field);rows.push(row);}
  return rows;
}
const fingerprint=transaction=>JSON.stringify([transaction.date,transaction.merchant.trim().toLowerCase(),transaction.type,transaction.amountCents]);
function validateImportRow(row) {
  row.errors=[];row.transaction=null;
  try {
    if(row.raw.length!==6) throw new Error('需要完整的 6 列数据');
    const [date,merchant,type,category,amount,note]=row.raw;
    const mapped=Object.entries(TYPES).find(([,label])=>label===type.trim())?.[0];
    row.transaction=validateTransaction({id:row.id,date:date.trim(),merchant,type:mapped,category:category.trim(),amountCents:parseMoney(amount),note,batchId:null});
  } catch(problem) {row.errors.push(problem.message);}
  return row;
}
function previewImport(text,existingTransactions) {
  if(new TextEncoder().encode(text).length>2*1024*1024) throw new Error('文件超过 2 MB，请分批导入');
  const rows=parseCSV(text);
  if(!rows.length || rows[0].length!==6 || rows[0].some((cell,index)=>cell.trim()!==CSV_HEADERS[index])) throw new Error('表头不匹配，请使用提供的 CSV 模板');
  const records=rows.slice(1).map((raw,index)=>({raw,rowNumber:index+2})).filter(row=>row.raw.some(cell=>cell.trim()));
  if(!records.length) throw new Error('文件没有账单记录');
  if(records.length>5000) throw new Error('一次最多导入 5,000 条，请拆分文件');
  const seen=new Set(existingTransactions.map(fingerprint));
  return records.map(({raw,rowNumber})=>{
    const row=validateImportRow({id:uid(),rowNumber,raw,errors:[],transaction:null,duplicate:false,selected:false});
    if(row.transaction) {const key=fingerprint(row.transaction);row.duplicate=seen.has(key);seen.add(key);row.selected=!row.duplicate;}
    return row;
  });
}
function commitImport(book,rows,batchId) {
  if(book.importBatches.some(batch=>batch.id===batchId)) throw new Error('此批次已经导入');
  const chosen=rows.filter(row=>row.selected);
  if(!chosen.length) throw new Error('请至少选择一条有效记录');
  const transactions=chosen.map(row=>{
    validateImportRow(row);
    if(row.errors.length) throw new Error(`第 ${row.rowNumber} 行：${row.errors.join('；')}`);
    return {...row.transaction,batchId};
  });
  return {...book,transactions:[...book.transactions,...transactions],importBatches:[...book.importBatches,{id:batchId,count:transactions.length,createdAt:new Date().toISOString()}]};
}
function undoImport(book,batchId) {
  return {...book,transactions:book.transactions.filter(row=>row.batchId!==batchId),importBatches:book.importBatches.filter(batch=>batch.id!==batchId)};
}
function escapeCell(value) {
  let text=String(value??'');
  if(/^[\s]*[=+\-@]/.test(text) || /^[\t\r\n]/.test(text)) text="'"+text;
  return /[",\r\n]/.test(text)?`"${text.replaceAll('"','""')}"`:text;
}
function exportCSV(transactions) {
  const rows=[CSV_HEADERS,...transactions.map(row=>[row.date,row.merchant,TYPES[row.type],row.category,(row.amountCents/100).toFixed(2),row.note])];
  return '\uFEFF'+rows.map(row=>row.map(escapeCell).join(',')).join('\r\n');
}

return {CSV_HEADERS,parseCSV,validateImportRow,previewImport,commitImport,undoImport,exportCSV};
},
"core/demo.mjs": function(requireModule) {
const {localDate,shiftMonth,CATEGORIES} = requireModule("core/model.mjs");

function createDemoBook(today=new Date()) {
  const current=localDate(today).slice(0,7);
  const book={transactions:[],budgets:{},purchases:[],feedback:{},importBatches:[]};
  let serial=0;
  for (let offset=-2;offset<=0;offset++) {
    const month=shiftMonth(current,offset);
    const [year,number]=month.split('-').map(Number);
    const last=offset===0?today.getDate():new Date(year,number,0).getDate();
    const add=(day,merchant,category,amountCents,type='expense',note='')=>{
      if(day<=last) book.transactions.push({id:`demo-${serial++}`,date:`${month}-${String(day).padStart(2,'0')}`,merchant,category,amountCents,type,note,batchId:null});
    };
    add(1,'每月生活费','其他',280000,'income');
    for(let day=1;day<=last;day++) {

"core/model.mjs": function(requireModule) {
const CATEGORIES = ['餐饮','购物','交通','娱乐','学习','生活','其他'];
const COLORS = ['#416d50','#acbb8e','#c88153','#86aab2','#b7a4c4','#d6c79e','#9eaba3'];
const TYPES = {expense:'支出',income:'收入',refund:'退款',transfer:'内部转账'};
const MAX_CENTS = 10_000_000_000;
const uid = () => globalThis.crypto.randomUUID();
function parseMoney(text) {
  const value = String(text).trim();
  if (!/^\d+(\.\d{1,2})?$/.test(value)) throw new Error('请输入非负金额，最多两位小数');
  const [whole, fraction=''] = value.split('.');
  const cents = Number(whole) * 100 + Number(fraction.padEnd(2,'0'));
  if (!Number.isSafeInteger(cents) || cents > MAX_CENTS) throw new Error('金额超过允许范围');
  return cents;
}
function validDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [year,month,day] = value.split('-').map(Number);
  if (year < 1900 || year > 2200 || month < 1 || month > 12 || day < 1) return false;
  return day <= new Date(year,month,0).getDate();
}
function validMonth(value) { return /^\d{4}-\d{2}$/.test(value) && validDate(`${value}-01`); }
function localDate(date=new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function shiftMonth(month,delta) {
  const [year,number] = month.split('-').map(Number);
  return localDate(new Date(year,number-1+delta,1)).slice(0,7);
}
function requireCents(value, allowZero=true) {
  if (!Number.isSafeInteger(value) || value < (allowZero?0:1) || value > MAX_CENTS) throw new Error('金额必须为有效的整数分');
  return value;
}
function validateTransaction(input) {
  if (!input || typeof input !== 'object') throw new Error('账单格式无效');
  if (!validDate(input.date)) throw new Error('日期无效，请使用 YYYY-MM-DD');
  if (!Object.hasOwn(TYPES,input.type)) throw new Error('请选择有效的收支类型');
  if (!CATEGORIES.includes(input.category)) throw new Error('请选择有效的分类');
  const merchant = String(input.merchant??'').trim();
  if (!merchant || merchant.length > 120) throw new Error('商户名称需为 1–120 个字符');
  const note = String(input.note??'');
  if (note.length > 1000) throw new Error('备注最多 1,000 个字符');
  if (!input.id || typeof input.id !== 'string') throw new Error('账单编号无效');
  return {id:input.id,date:input.date,merchant,type:input.type,category:input.category,
    amountCents:requireCents(input.amountCents,false),note,batchId:input.batchId??null};
}
function validateBudget(input) {
  if (!validMonth(input?.month)) throw new Error('预算月份无效');
  const totalCents = requireCents(input.totalCents);
  const categoryLimits = {};
  for (const [category,amount] of Object.entries(input.categoryLimits??{})) {
    if (!CATEGORIES.includes(category)) throw new Error('预算分类无效');
    categoryLimits[category] = requireCents(amount);
  }
  if (Object.values(categoryLimits).reduce((sum,amount)=>sum+amount,0)>totalCents) throw new Error('分类额度之和不能超过总预算');
  return {month:input.month,totalCents,categoryLimits,savingsGoalCents:requireCents(input.savingsGoalCents??0)};
}
function emptyBudget(month) { return {month,totalCents:0,categoryLimits:{},savingsGoalCents:0}; }
function getBudget(book,month) { return book.budgets[month]??emptyBudget(month); }

return {CATEGORIES,COLORS,TYPES,MAX_CENTS,uid,parseMoney,validDate,validMonth,localDate,shiftMonth,requireCents,validateTransaction,validateBudget,emptyBudget,getBudget};
},
"core/purchases.mjs": function(requireModule) {
const {uid,CATEGORIES,requireCents,validDate,getBudget,validateTransaction} = requireModule("core/model.mjs");
const {summarize} = requireModule("core/analytics.mjs");

function validateInput(input) {
  if(typeof input.name!=='string'||!input.name.trim()||input.name.length>120)throw new Error('商品名称需为 1–120 个字符');
  if(!CATEGORIES.includes(input.category))throw new Error('请选择有效的商品分类');
  requireCents(input.amountCents,false);
  if(typeof input.reason!=='string'||input.reason.length>1000)throw new Error('购买原因最多 1,000 个字符');
}
function analyzePurchase(book,month,input) {
  validateInput(input);
  const summary=summarize(book.transactions,month),budget=getBudget(book,month);
  const hasBudget=budget.totalCents>0;
  const remainingBeforeCents=hasBudget?budget.totalCents-summary.netExpenseCents:null;
  const remainingAfterCents=hasBudget?remainingBeforeCents-input.amountCents:null;
  const categoryLimit=budget.categoryLimits[input.category]??0;
  const categoryRemainingCents=categoryLimit>0?categoryLimit-summary.categories[input.category]:null;
  const reasons=[];
  if(!hasBudget)reasons.push('本月还没有设置总预算，暂时不能判断这笔购买是否超出计划。');
  else if(remainingAfterCents<0)reasons.push(`购买后将超出本月总预算 ¥${(-remainingAfterCents/100).toFixed(2)}。可以先看看是否需要调整其他安排。`);
  else reasons.push('这笔购买在当前总预算范围内。不过，预算够用并不代表一定要买。');
  if(categoryRemainingCents===null)reasons.push('这个类别还没有分配预算，可以先预留必要的生活支出。');
  else if(input.amountCents>categoryRemainingCents)reasons.push('这笔购买会超过该类别的剩余额度，总预算与分类预算需要一起考虑。');
  reasons.push('想一想具体什么时候会用到它。如果暂时说不清，可以先放进冷静清单。');
  return {remainingBeforeCents,remainingAfterCents,categoryRemainingCents,reasons};
}
function addPurchase(book,input,now=new Date()) {
  validateInput(input);

  const item={id:uid(),name:input.name.trim(),category:input.category,amountCents:input.amountCents,reason:input.reason,
    createdAt:now.toISOString(),remindAt:new Date(now.getTime()+input.coolingHours*3600000).toISOString(),status:'considering',transactionId:null};
  return {...book,purchases:[item,...book.purchases]};
}
function markPurchase(book,id,status) {
  if(!['considering','purchased','skipped'].includes(status))throw new Error('购买状态无效');
  if(!book.purchases.some(item=>item.id===id))throw new Error('未找到这条购买计划');
  return {...book,purchases:book.purchases.map(item=>item.id===id?{...item,status}:item)};
}
function recordPurchase(book,id,date) {
  if(!validDate(date))throw new Error('购买日期无效');
  const item=book.purchases.find(record=>record.id===id);
  if(!item)throw new Error('未找到这条购买计划');
  if(item.transactionId&&book.transactions.some(row=>row.id===item.transactionId))return book;
  const transaction=validateTransaction({id:uid(),date,merchant:item.name,type:'expense',category:item.category,amountCents:item.amountCents,note:'来自买前想想 · '+item.reason,batchId:null});
  return {...book,transactions:[...book.transactions,transaction],purchases:book.purchases.map(record=>record.id===id?{...record,status:'purchased',transactionId:transaction.id}:record)};
}

return {analyzePurchase,addPurchase,markPurchase,recordPurchase};
},
"core/store.mjs": function(requireModule) {
const {validateTransaction,validateBudget,requireCents,CATEGORIES} = requireModule("core/model.mjs");

const STORAGE_KEY='huayoushu:v1';
function createEmptyBook() {return {transactions:[],budgets:{},purchases:[],feedback:{},importBatches:[]};}
function validateBook(book) {

      || typeof item.reason!=='string' || item.reason.length>1000 || (item.transactionId!==null && typeof item.transactionId!=='string')) throw new Error('购买清单结构无效');

  const initial=()=>({version:1,mode:'demo',demo:createDemoBook(today),personal:createEmptyBook()});
  let state=initial(),error=null,raw=null;
  const listeners=new Set();
  try {
    raw=storage.getItem(STORAGE_KEY);
    if(raw!==null) {const parsed=JSON.parse(raw);validateState(parsed);state=parsed;}
  } catch(problem) {error=`无法读取本地账本：${problem.message}`;}
  const emit=()=>listeners.forEach(listener=>listener());
  function commit(reducer) {
    if(error) return {ok:false,error:'本地数据需要处理，请先到设置页备份或恢复'};
    try {
      if(storage.getItem(STORAGE_KEY)!==raw) throw new Error('另一标签页已修改账本，请刷新后再编辑');
      const next=reducer(structuredClone(state));validateState(next);
      const serialized=JSON.stringify(next);storage.setItem(STORAGE_KEY,serialized);

  }

    getState:()=>structuredClone(state),get error(){return error;},get raw(){return raw;},
    subscribe(listener){listeners.add(listener);return()=>listeners.delete(listener);},commit,
    switchMode:mode=>commit(next=>({...next,mode})),

  };
}

return {STORAGE_KEY,createEmptyBook,createStore};
},

"ui/charts.mjs": function(requireModule) {

const svgElement=(tag,attributes={},children=[])=>{

  for(const child of children)node.append(typeof child==='string'?document.createTextNode(child):child);
  return node;
};
function trendChart(summary,month) {
  const [year,number]=month.split('-').map(Number),days=new Date(year,number,0).getDate();
  const values=Array.from({length:days},(_,index)=>summary.daily[`${month}-${String(index+1).padStart(2,'0')}`]??0);
  const max=Math.max(10000,...values),min=Math.min(0,...values),range=max-min;

  }
  const points=values.map((value,index)=>`${x(index)},${y(value)}`);

    svgElement('polyline',{points:points.join(' '),fill:'none',stroke:'#416d50','stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'}));

  const details=el('details',{class:'chart-details'},[el('summary',{},'查看每日金额'),el('div',{class:'daily-values'},values.map((value,index)=>el('span',{},`${index+1}日 ¥${money(value)}`)))]);

  const note=el('textarea',{rows:2,maxlength:1000,placeholder:'记下一点细节（可选）'},existing?.note??'');
  const form=el('form',{class:'form-grid',onSubmit:event=>event.preventDefault()},[
    field('交易日期',date),field('商户 / 来源',merchant),field('收支类型',type),field('分类',category),field('金额（元）',amount),field('备注',note)]);
  showDialog({title:existing?'编辑这笔账':'记一笔',content:form,confirmLabel:'保存账单',onConfirm:()=>{
    const record=validateTransaction({id:existing?.id??uid(),date:date.value,merchant:merchant.value,type:type.value,category:category.value,amountCents:parseMoney(amount.value),note:note.value,batchId:existing?.batchId??null});
    return saveBook(context,book=>({...book,transactions:existing?book.transactions.map(row=>row.id===existing.id?record:row):[...book.transactions,record]}),'账单已保存');
  }});
}

return {el,money,currency,button,text,pageHeading,panel,emptyState,notify,download,showDialog,confirmAction,field,input,select,progressBar,categoryDot,transactionAmount,saveBook,transactionDialog};
}};

})();</script>
